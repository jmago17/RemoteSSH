name: RemoteSSH
options:
  bundleIdPrefix: com.maromeapps
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    minorVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    minorVersion: 1.15.0

targets:
  RemoteSSH:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: RemoteSSH.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maromeapps.RemoteSSH
        PRODUCT_NAME: RemoteSSH
        DEVELOPMENT_TEAM: ES2766ARHJ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: RemoteSSH
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: RemoteSSH.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: RemoteSSH-Info.plist
      properties:
        CFBundleDisplayName: RemoteSSH
        # Export compliance. Declared here so App Store Connect stops asking
        # the encryption questions on every upload — unanswered, they hold the
        # build back from TestFlight.
        #
        # `false` is Josu's call, made knowingly on 2026-08-23, and NOT what
        # Apple's own table points to. That table asks for a French encryption
        # declaration when an app uses industry-standard algorithms the OS does
        # not provide — which is this app: swift-nio-ssh encrypts the transport
        # from inside the binary, so it isn't the "HTTPS via URLSession" case
        # that needs no paperwork. None of the five ASC exemptions fit either;
        # SSH doesn't stop at authentication.
        #
        # What holds it up: the French declaration is about distributing in
        # France, and this ships to Josu's own iPhone over internal TestFlight.
        # Revisit before any real public release — see CLAUDE.md.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "RemoteSSH connects to your Mac over SSH to list and attach to tmux sessions."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.maromeapps.RemoteSSH
            CFBundleURLSchemes:
              - remotessh
    dependencies:
      - package: Citadel
      - package: SwiftTerm
