name: RemoteSSH
options:
  bundleIdPrefix: com.maromeapps
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    minorVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    minorVersion: 1.15.0

targets:
  RemoteSSH:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: RemoteSSH.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maromeapps.RemoteSSH
        PRODUCT_NAME: RemoteSSH
        DEVELOPMENT_TEAM: ES2766ARHJ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: RemoteSSH
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: RemoteSSH.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: RemoteSSH-Info.plist
      properties:
        CFBundleDisplayName: RemoteSSH
        # Export compliance. Declared here so App Store Connect stops asking
        # the encryption questions on every single upload — unanswered, they
        # hold the build back from TestFlight.
        #
        # `false` says the app uses no encryption beyond forms exempt from
        # export documentation. The basis: RemoteSSH implements no crypto of
        # its own. It calls Apple's CryptoKit (SHA256, Curve25519) and links
        # swift-nio-ssh / swift-crypto — Apple's own open-source libraries
        # doing standard SSH algorithms. Apple's line is that OS-provided
        # encryption is exempt while *proprietary* encryption is not, and
        # there is none of the latter here.
        #
        # Note this is a legal declaration, not a build setting: it is Josu's
        # to make, and using exempt encryption can still carry a US year-end
        # self-classification reporting duty.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "RemoteSSH connects to your Mac over SSH to list and attach to tmux sessions."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.maromeapps.RemoteSSH
            CFBundleURLSchemes:
              - remotessh
    dependencies:
      - package: Citadel
      - package: SwiftTerm
