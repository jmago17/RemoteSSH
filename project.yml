name: RemoteSSH
options:
  bundleIdPrefix: com.danobat
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    minorVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    minorVersion: 1.15.0

targets:
  RemoteSSH:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: RemoteSSH.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danobat.RemoteSSH
        PRODUCT_NAME: RemoteSSH
        DEVELOPMENT_TEAM: ES2766ARHJ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: RemoteSSH
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: RemoteSSH-Info.plist
      properties:
        CFBundleDisplayName: RemoteSSH
        NSLocalNetworkUsageDescription: "RemoteSSH connects to your Mac over SSH to list and attach to tmux sessions."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.danobat.RemoteSSH
            CFBundleURLSchemes:
              - remotessh
    dependencies:
      - package: Citadel
      - package: SwiftTerm
